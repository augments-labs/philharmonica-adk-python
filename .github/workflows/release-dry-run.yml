name: Release dry-run

# Maintainer-triggered rehearsal of the release path with ZERO external
# side effects: build the wheel + sdist, twine-check the metadata, install
# the wheel into a fresh venv, and smoke-test import + CLI from OUTSIDE the
# repo (src-layout can mask packaging gaps when importing from the checkout).
# Nothing here uploads anywhere — the real publish path is release-tag.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Build + verify artifacts (no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build artifacts
        run: uv build
      - name: Validate metadata
        run: uvx twine check dist/*
      - name: Fresh-venv install + smoke test (from /tmp)
        run: |
          uv venv /tmp/philharmonica-dry-run
          uv pip install --python /tmp/philharmonica-dry-run/bin/python dist/*.whl
          cd /tmp
          /tmp/philharmonica-dry-run/bin/python -c "import philharmonica.adk"
          /tmp/philharmonica-dry-run/bin/philharmonica --help >/dev/null
