name: Release — open PR

# Step 1 of the release flow (see RELEASING.md). A maintainer triggers this
# and picks the SemVer increment; commitizen rewrites both version locations
# (pyproject.toml + src/philharmonica/adk/__init__.py), then this opens a
# release PR. update_changelog_on_bump is off, so CHANGELOG.md is NOT touched
# here — fold [Unreleased] into its dated heading on main first (RELEASING.md).
# Merging that PR fires release-tag.yml, which tags AND publishes to PyPI.
# This workflow itself publishes nothing.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: SemVer increment
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Bump + open release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitizen needs full history + tags
          ref: main
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version + changelog (files only, no commit/tag)
        id: bump
        run: |
          uvx --from "commitizen>=4.4.0" cz bump --yes --files-only --increment "${{ inputs.increment }}"
          echo "version=$(uvx --from "commitizen>=4.4.0" cz version --project)" >> "$GITHUB_OUTPUT"
      - name: Create release branch + PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          branch="release/v${version}"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(release): v${version}"
          git push --set-upstream origin "$branch"
          body=$(cat <<EOF
          Automated release PR for **v${version}**.

          - Version bumped in \`pyproject.toml\` and \`src/philharmonica/adk/__init__.py\`.
          - \`CHANGELOG.md\` is untouched by this workflow; confirm \`main\` already carries the \`[${version}]\` heading.

          Review the version and changelog, confirm CI is green, then **merge as a merge commit**.

          > **Merging publishes.** It tags \`v${version}\`, creates the GitHub Release with the
          > wheel + sdist attached, and uploads those same artifacts to PyPI. No approval is
          > requested, and a version once on PyPI can never be reused.
          EOF
          )
          gh pr create --base main --head "$branch" \
            --title "chore(release): v${version}" \
            --label release \
            --body "$body" \
          || gh pr create --base main --head "$branch" \
            --title "chore(release): v${version}" \
            --body "$body"
